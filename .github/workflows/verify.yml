name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject superseded repository paths
        run: npm run check:repository-hygiene

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pull-request smoke or full main suite
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:pr
          else
            npm run test:fast
          fi
        env:
          # Shared GitHub runners are markedly slower than local development.
          # Keep the script's 60 s local gate while allowing CI variance.
          CIRCLEHEART_FAST_TEST_BUDGET_MS: 90000

  whitespace:
    name: Check diff whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          fi

  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - build
      - test
      - whitespace
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WHITESPACE_RESULT: ${{ needs.whitespace.result }}
        run: |
          failed=0
          for item in \
            "Repository hygiene:$HYGIENE_RESULT" \
            "Build:$BUILD_RESULT" \
            "Test:$TEST_RESULT" \
            "Check diff whitespace:$WHITESPACE_RESULT"
          do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
