name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject superseded repository paths
        run: npm run check:repository-hygiene

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify exact V3 registry admission
        run: npm run verify:registry:main-wire-v3
        env:
          CIRCLEHEART_REGISTRY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pull-request smoke or full main suite
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:pr
          else
            npm run test:fast
          fi
        env:
          # Shared runners are markedly slower on the exact V3 hot-path and
          # session tests. Keep the 60 s local gate while allowing CI variance;
          # this remains a runaway-process guard rather than a performance gate.
          CIRCLEHEART_FAST_TEST_BUDGET_MS: 300000

      - name: Verify exact V3 snapshot qualification
        if: github.event_name == 'pull_request'
        # Keep the cold-to-P1 gate outside the parallel smoke worker pool. The
        # test yields only at accepted cycle boundaries so Vitest RPC stays live.
        run: >-
          node node_modules/vitest/vitest.mjs run
          --config vitest.canonical.config.ts
          __tests__/mainWireIntegratedModelSnapshotQualificationV3.test.ts

  browser:
    name: Workbench browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        # Browser smoke must exercise the exact bundle committed by the PR.
        # A production-mode build resolves the already-active remote bundle,
        # which necessarily remains on the preceding release until this PR is
        # reviewed, merged, published, and activated.
        run: npm run build -- --mode test

      - name: Run desktop and mobile Workbench smoke
        run: npm run test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  supabase:
    name: Supabase schema and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start local Supabase
        run: supabase start

      - name: Run database tests
        run: supabase test db --local supabase/tests/database

      - name: Lint local database
        run: >-
          supabase db lint --local
          --schema public,studio
          --level error
          --fail-on error

  whitespace:
    name: Check diff whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          fi

  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - build
      - browser
      - supabase
      - test
      - whitespace
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WHITESPACE_RESULT: ${{ needs.whitespace.result }}
        run: |
          failed=0
          for item in \
            "Repository hygiene:$HYGIENE_RESULT" \
            "Build:$BUILD_RESULT" \
            "Workbench browser smoke:$BROWSER_RESULT" \
            "Supabase schema and policy tests:$SUPABASE_RESULT" \
            "Test:$TEST_RESULT" \
            "Check diff whitespace:$WHITESPACE_RESULT"
          do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
