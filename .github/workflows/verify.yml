name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_e2e: ${{ steps.classify.outputs.browser_e2e }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "browser_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: run full browser verification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | tee changed-files.txt

          browser_e2e=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|.codex/skills/*)
                ;;
              engine/mechanics2/*|engine/mechanics2/**/*)
                ;;
              tools/mechanics2/*|tools/mechanics2/**/*)
                ;;
              data/mechanics2/*|data/mechanics2/**/*)
                ;;
              __tests__/mechanics2*.test.ts)
                ;;
              .github/workflows/verify.yml)
                browser_e2e=true
                ;;
              .DS_Store|*/.DS_Store|migrated_prompt_history/*)
                ;;
              *)
                browser_e2e=true
                ;;
            esac
          done < changed-files.txt

          echo "browser_e2e=$browser_e2e" >> "$GITHUB_OUTPUT"
          {
            echo "### Change classification"
            echo ""
            echo "- browser_e2e: \`$browser_e2e\`"
            echo ""
            echo "Changed files:"
            sed 's/^/- `/' changed-files.txt | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pull-request smoke or full main suite
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:pr
          else
            npm run test:fast
          fi
        env:
          # Shared GitHub runners are markedly slower than local development.
          # Keep the script's 60 s local gate while allowing CI variance.
          CIRCLEHEART_FAST_TEST_BUDGET_MS: 90000

  scientific_artifacts:
    name: Scientific release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated release artifacts, catalogs, and frontend projection
        run: |
          npx vitest run \
            __tests__/mainWireIntegratedPreviewWorkerIntegrityV1.test.ts \
            __tests__/mainWireIntegratedPreviewSessionV1.test.ts \
            __tests__/mainWireIntegratedModelPeriodicSteadyV3.test.ts \
            __tests__/mainWireIntegratedModelTransactionV3.test.ts
          npm run verify:scientific:integrated-preview-seed
          npm run verify:scientific:integrated-preview-release
          npm run verify:scientific:product-release-catalogs
          npm run verify:scientific:integrated-preview-frontend

  browser_e2e:
    name: Production browser E2E
    needs:
      - classify_changes
    if: ${{ github.event_name != 'pull_request' || needs.classify_changes.outputs.browser_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser E2E
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:e2e:browser:pr
          else
            npm run test:e2e:browser
          fi

      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  whitespace:
    name: Check diff whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          fi

  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    needs:
      - classify_changes
      - build
      - test
      - scientific_artifacts
      - browser_e2e
      - whitespace
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BROWSER_E2E: ${{ needs.classify_changes.outputs.browser_e2e }}
          CLASSIFY_CHANGES_RESULT: ${{ needs.classify_changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SCIENTIFIC_ARTIFACTS_RESULT: ${{ needs.scientific_artifacts.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser_e2e.result }}
          WHITESPACE_RESULT: ${{ needs.whitespace.result }}
        run: |
          failed=0
          for item in \
            "Classify changes:$CLASSIFY_CHANGES_RESULT" \
            "Build:$BUILD_RESULT" \
            "Test:$TEST_RESULT" \
            "Scientific release artifacts:$SCIENTIFIC_ARTIFACTS_RESULT" \
            "Production browser E2E:$BROWSER_E2E_RESULT" \
            "Check diff whitespace:$WHITESPACE_RESULT"
          do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$result" = "skipped" ]; then
              case "$name" in
                "Production browser E2E")
                  if [ "$BROWSER_E2E" != "true" ]; then
                    continue
                  fi
                  ;;
              esac
            fi
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
