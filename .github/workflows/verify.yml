name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Verify baseline
        run: npm run verify:baseline -- --out=artifacts/verification/latest

      - name: Verify official cases
        run: npm run verify:cases -- --out=artifacts/case-validation/latest

      - name: Check diff whitespace
        run: git diff --check

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            artifacts/verification/latest
            artifacts/case-validation/latest
          if-no-files-found: warn
