name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly heavy verification at 03:17 JST.
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Fast test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/3
          - 2/3
          - 3/3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -- --shard=${{ matrix.shard }}

  heavy_tests:
    name: Heavy verification tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run heavy tests
        run: npm run test:heavy

  verify_baseline:
    name: Verify baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify baseline
        run: npm run verify:baseline -- --out=artifacts/verification/latest

      - name: Upload baseline verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-verification-artifacts
          path: artifacts/verification/latest
          if-no-files-found: warn

  verify_cases:
    name: Verify official cases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify official cases
        run: npm run verify:cases -- --out=artifacts/case-validation/latest

      - name: Publish case validation summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/case-validation/latest/report.md ]; then
            cat artifacts/case-validation/latest/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload case validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-validation-artifacts
          path: artifacts/case-validation/latest
          if-no-files-found: warn

  whitespace:
    name: Check diff whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          fi

  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - verify_baseline
      - verify_cases
      - whitespace
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          VERIFY_BASELINE_RESULT: ${{ needs.verify_baseline.result }}
          VERIFY_CASES_RESULT: ${{ needs.verify_cases.result }}
          WHITESPACE_RESULT: ${{ needs.whitespace.result }}
        run: |
          failed=0
          for item in \
            "Build:$BUILD_RESULT" \
            "Test:$TEST_RESULT" \
            "Verify baseline:$VERIFY_BASELINE_RESULT" \
            "Verify official cases:$VERIFY_CASES_RESULT" \
            "Check diff whitespace:$WHITESPACE_RESULT"
          do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
