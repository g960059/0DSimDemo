name: Verify legacy model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Legacy ModelCore baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legacy baseline
        run: npm run verify:baseline -- --out=artifacts/verification/latest

      - name: Upload baseline verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-baseline-verification-artifacts
          path: artifacts/verification/latest
          if-no-files-found: warn
