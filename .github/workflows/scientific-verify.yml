name: Scientific verification

on:
  workflow_dispatch:
    inputs:
      run_archive:
        description: Run historical research and artifact-replay tests
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly current-model verification at 03:17 JST.
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite_inventory:
    name: Scientific suite inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_files: ${{ steps.inventory.outputs.canonical_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count canonical test files
        id: inventory
        shell: bash
        run: |
          canonical_files=$(find __tests__ -maxdepth 1 -name 'mainWire*.test.ts' -print | wc -l | tr -d ' ')
          echo "canonical_files=$canonical_files" >> "$GITHUB_OUTPUT"
          echo "Canonical mainWire test files: $canonical_files" >> "$GITHUB_STEP_SUMMARY"

  engine_regression:
    name: Engine regression (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine regression shard
        run: npm run test:regression -- --shard=${{ matrix.shard }}

  canonical_scientific:
    name: Canonical scientific tests (${{ matrix.shard }})
    needs:
      - suite_inventory
    if: ${{ needs.suite_inventory.outputs.canonical_files != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical scientific shard
        run: npm run test:scientific:canonical -- --shard=${{ matrix.shard }}

  release_artifacts:
    name: Scientific release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated release artifacts, catalogs, and frontend projection
        run: |
          # These exact-replay suites are CPU-bound. Running several solver
          # instances in parallel can exhaust an individual test's time budget
          # on two-core GitHub runners even when every assertion is healthy.
          npx vitest run --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            __tests__/mainWireIntegratedPreviewWorkerIntegrityV1.test.ts \
            __tests__/mainWireIntegratedPreviewSessionV1.test.ts \
            __tests__/mainWireIntegratedModelPeriodicSteadyV3.test.ts \
            __tests__/mainWireIntegratedModelTransactionV3.test.ts
          npm run verify:scientific:integrated-preview-seed
          npm run verify:scientific:integrated-preview-release
          npm run verify:scientific:product-release-catalogs
          npm run verify:scientific:integrated-preview-frontend

  heavy:
    name: Opt-in heavy engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run heavy tests
        run: npm run test:heavy

  archived_research:
    name: Archived research (${{ matrix.shard }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_archive }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/12
          - 2/12
          - 3/12
          - 4/12
          - 5/12
          - 6/12
          - 7/12
          - 8/12
          - 9/12
          - 10/12
          - 11/12
          - 12/12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run archived research shard
        run: npm run test:scientific:archive -- --shard=${{ matrix.shard }}
