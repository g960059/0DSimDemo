name: Scientific verification

on:
  workflow_dispatch:
  schedule:
    # Nightly current-model verification at 03:17 JST.
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite_inventory:
    name: Scientific suite inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_files: ${{ steps.inventory.outputs.canonical_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Count canonical test files
        id: inventory
        shell: bash
        run: |
          # From the suite registry, not a filename glob: some mainWire files
          # are promoted to fast and the canonical lane also owns exact
          # coronary files, so a glob count does not match what actually runs.
          canonical_files=$(npm run --silent test:suites:inventory -- --canonical-only)
          echo "canonical_files=$canonical_files" >> "$GITHUB_OUTPUT"
          npm run --silent test:suites:inventory >> "$GITHUB_STEP_SUMMARY"

  engine_regression:
    name: Engine regression (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine regression shard
        run: npm run test:regression -- --shard=${{ matrix.shard }}

  canonical_scientific:
    name: Canonical scientific tests (${{ matrix.shard }})
    needs:
      - suite_inventory
    if: ${{ needs.suite_inventory.outputs.canonical_files != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical scientific shard
        run: npm run test:scientific:canonical -- --shard=${{ matrix.shard }}

  heavy:
    name: Opt-in heavy engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run heavy tests
        run: npm run test:heavy

  browser_e2e_full:
    name: Production browser E2E (full, including @full-e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The per-push gate runs everything except @full-e2e. These are the
      # long-running stress tests, so they belong with the nightly numerical
      # verification rather than in front of every merge.
      - name: Run the full production browser E2E suite
        run: npm run test:e2e:browser

      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-browser-e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
