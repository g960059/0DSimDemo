<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircleHeart</title>
    <style>
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      .blocknote-dark-theme-override .bn-editor {
          background-color: transparent !important;
      }
      .blocknote-dark-theme-override .bn-side-menu[data-theme="dark"] {
          background-color: #1e293b !important;
          border-color: #334155 !important;
      }
      .blocknote-dark-theme-override .bn-menu-dropdown[data-theme="dark"] {
          background-color: #1e293b !important;
          border-color: #334155 !important;
      }
    </style>
</head>
  <body class="antialiased overflow-hidden">
    <script>
      // The stored theme is applied before first paint. Waiting for React
      // would show a dark body to someone who chose light, on every load.
      (function () {
        try {
          var stored = localStorage.getItem('circleheart.app.theme');
          document.body.dataset.workbenchTheme = stored === 'light' ? 'light' : 'dark';
        } catch (error) {
          document.body.dataset.workbenchTheme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
